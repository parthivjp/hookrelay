services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
      POSTGRES_DB: hookrelay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env.example
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    env_file: .env.example
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - api

  beat:
    build: .
    env_file: .env.example
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      - api

  demo-receiver:
    build: .
    environment:
      WEBHOOK_SECRET: whsec_demo
      FAIL_RATE: "0.5"
    command: uvicorn demo_receiver.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

volumes:
  pgdata:
